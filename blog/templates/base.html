{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="{% static 'imagenes/JC.jpg' %}">

    <title>{% block titulo %}Presentación{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>
<body>

<input type="checkbox" id="tema-toggle">
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <label for="tema-toggle" class="tema-boton">
            <i class="fa-solid fa-moon"></i>
        </label>
        <a class="navbar-brand" href="{% url 'inicio' %}">
            <i class="fa-solid fa-code"></i>
            INICIO
        </a>
        <div id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'inicio' %}#sobre-mi">
                        Sobre mí
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'inicio' %}#proyectos">
                        Proyectos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'lista' %}">
                        Blog
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'inicio' %}#contacto">
                        Contacto
                    </a>
                </li>
            </ul>

        </div>

    </div>

</nav>

<main>
    {% block contenido %}{% endblock %}
</main>

<footer>

    <p>
        © 2026 JC GROUP — TP
        <br>
        En caso de no andar mail. Mi mail de contacto es <strong> bramirezreyna@alumno.huergo.edu.ar </strong>
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const temaToggle = document.getElementById('tema-toggle');
        const temaKey = 'tema-oscuro';

        const savedTheme = localStorage.getItem(temaKey) === 'true';
        if (savedTheme) {
            temaToggle.checked = true;
        }

        temaToggle.addEventListener('change', function() {
            localStorage.setItem(temaKey, String(this.checked));
        });
    })();
</script>
</body>
</html>
